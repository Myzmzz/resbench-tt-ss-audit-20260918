# 本版不生成场景的规则。参数关系属于概率型 / 累积型 / 滞后型 / 组合型 / 时机型 / 状态型，
# 现有信号写不出稳定断言，或需要先有额外测量与状态。随库发布，供人工评审与后续版本使用。
advisories:

- advisory_id: A-RETRY-01
  name: 重试放大把过载推成自持
  mechanism_group: retry_backoff
  parameter_kind: 概率型
  rule:
    statement: 当下游因过载开始拒绝时，重试带来的额外流量会把下游推得更满，进而产生更多拒绝，形成自持的正反馈。
    sources:
      - doc_id: sre-cascading-failures
        quote: |-
          The volume of retries grows: 100 QPS of retries in the first second leads to 200 QPS, then to 300 QPS, and so on. Fewer and fewer requests are able to succeed on their first attempt, so less useful work is being performed as a fraction of requests to the backend.
        location: Retries
      - doc_id: sre-cascading-failures
        quote: |-
          If the backend spends a significant amount of resources processing requests that will ultimately fail due to overload, then the retries themselves may be keeping the backend in an overloaded mode.
        location: Retries
  why_not_supported: 是否进入正反馈取决于下游容量、当前负载水位与拒绝成本的比值，同一份配置在不同负载下结论相反，写不出与配置参数挂钩的判定边界。
  what_is_needed: 需要下游的容量曲线（吞吐随并发的拐点）、拒绝一个请求相对处理一个请求的成本比，以及注入时的实际负载水位；具备这三项后可退化为一条以负载水位为自变量的阈值规则。

- advisory_id: A-RETRY-02
  name: 重试与熔断的相互作用
  mechanism_group: retry_backoff
  parameter_kind: 状态型
  rule:
    statement: 重试逻辑应当识别熔断器给出的拒绝，并在熔断指示故障不是瞬时的时候停止重试。
    sources:
      - doc_id: azure-pattern-circuit-breaker
        quote: |-
          An application can combine these two patterns by using the Retry pattern to invoke an operation through a circuit breaker. However, the retry logic should be sensitive to any exceptions that the circuit breaker returns and stop retry attempts if the circuit breaker indicates that a fault isn't transient.
        location: Circuit Breaker pattern > Comparison to the Retry pattern
  why_not_supported: 判定要看熔断器当时处于哪个状态、以及重试是否把「熔断拒绝」计入了失败，属状态相关；同样的配置在闭合态与打开态下的正确行为不同，无法只凭静态配置判出违反。
  what_is_needed: 需要能在运行时读取熔断器状态机的当前状态与状态变迁时刻，并能把每次重试决策与当时的状态对齐。

- advisory_id: A-SHED-01
  name: 过载解除后系统回不到正常态（亚稳态）
  mechanism_group: load_shedding_admission
  parameter_kind: 滞后型
  rule:
    statement: 触发过载的条件消失之后，系统可能仍停在低吞吐的过载态，需要显著降低负载或切断流量才能恢复。
    sources:
      - doc_id: sre-cascading-failures
        quote: |-
          Even if the rate of calls to MakeRequest decreases to pre-meltdown levels (9,000 QPS, for example), depending on how much returning a failure costs the backend, the problem might not go away.
        location: Retries
      - doc_id: sre-cascading-failures
        quote: |-
          If either of these conditions is true, in order to dig out of this outage, you must dramatically reduce or eliminate the load on the frontends until the retries stop and the backends stabilize.
        location: Retries
  why_not_supported: 判定要看「撤销注入之后系统是否自行回到基线」，而进入与退出的负载阈值不同（滞后），退出阈值取决于队列里积压了多少、重试预算恢复得多快，无法从配置参数算出一个边界。
  what_is_needed: 需要在撤销注入后持续观测足够长的窗口，并能比较进入过载与退出过载两个方向的负载阈值；还需要能测出积压深度随时间的衰减速率。

- advisory_id: A-SHED-02
  name: 客户端自适应节流
  mechanism_group: load_shedding_admission
  parameter_kind: 状态型
  rule:
    statement: 后端开始拒绝时，客户端应当按后端的接受率自适应地降低发出量，而不是把拒绝的开销全留给后端。
    sources:
      - doc_id: sre-handling-overload
        quote: |-
          As the rate at which the application attempts requests to the client grows (relative to the rate at which the backend accepts them), we want to increase the probability of dropping new requests.
        location: Client-Side Throttling > Client request rejection probability
      - doc_id: sre-handling-overload
        quote: |-
          We've found adaptive throttling to work well in practice, leading to stable rates of requests overall.
        location: Client-Side Throttling > Client request rejection probability
  why_not_supported: 是否违反取决于客户端本地统计的「请求数 / 接受数」滑动状态，而这个状态既不在配置里也不在代码常量里；同一份代码在不同后端拒绝率下表现不同，静态查不出，运行时也需要客户端自报该状态才能判。
  what_is_needed: 需要客户端暴露自适应节流的内部状态（请求数、接受数、本地丢弃数）作为指标，或在实验中能按已知比例控制后端的拒绝率并观测客户端发出量的响应曲线。

- advisory_id: A-CONN-01
  name: 连接或资源泄漏导致的缓慢耗尽
  mechanism_group: connection_lifecycle
  parameter_kind: 累积型
  rule:
    statement: 派生出的 context、连接与游标若没有在所有控制流路径上释放，会随请求量累积，直到资源耗尽。
    sources:
      - doc_id: go-context
        quote: |-
          Failing to call the CancelFunc leaks the child and its children until the parent is canceled. The go vet tool checks that CancelFuncs are used on all control-flow paths.
        location: context package > Overview
  why_not_supported: 是否出问题取决于泄漏速率与总量的乘积随时间的累积，同一处泄漏在低流量下几个月都不发作、在高流量下几分钟就耗尽；注入一次故障看不出结论，需要长时间基线对比。
  what_is_needed: 需要在恒定负载下长时间观测资源占用的斜率（连接数、协程数、文件描述符随时间的增长），并能把斜率归因到具体的代码路径。

- advisory_id: A-IDEM-01
  name: 副作用与确认之间的时序窗口
  mechanism_group: idempotency_compensation
  parameter_kind: 时机型
  rule:
    statement: 业务副作用与对外确认之间存在一个时间窗，在这个窗口内中断会造成「做了但没记」或「记了但没做」。
    sources:
      - doc_id: aws-builders-idempotency
        quote: |-
          An important consideration is that the process that combines recording the idempotent token and all mutating operations related to servicing the request must meet the properties for an atomic, consistent, isolated, and durable (ACID) operation.
        location: Making retries safe with idempotent APIs > Reducing client complexity with idempotent API design
  why_not_supported: 触发与否取决于中断恰好落在哪个毫秒级窗口内，是时机相关而非幅值相关；现有的实例终止原语无法把中断精确对齐到那个窗口，反复注入也只是概率命中。
  what_is_needed: 需要能在指定代码点暂停或终止进程的注入能力（故障点注入），或能在测试环境里对该窗口加锁放大，才能把它变成可稳定复现的场景。
