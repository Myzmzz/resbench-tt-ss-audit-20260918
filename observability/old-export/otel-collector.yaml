receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  resource:
    attributes:
      - key: deployment.environment
        value: train-ticket
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger-query.observability.svc.cluster.local:4317
    tls:
      insecure: true
  otlphttp/coroot:
    endpoint: http://coroot-coroot.coroot:8080
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: train_ticket
    const_labels:
      source: otel-collector
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - resource
        - batch
      exporters:
        - otlp/jaeger
        - otlphttp/coroot
    metrics:
      receivers:
        - otlp
      processors:
        - resource
        - batch
      exporters:
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - resource
        - batch
      exporters:
        - debug
